<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img">
<title>一条完整的媒体工作流</title><desc>已有网盘媒体时，可以从第 3 步的同步开始。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#638094" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="510" rx="24" fill="#eff4f8"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="45" y="60" fill="#132e44" font-size="28" font-weight="700">一条完整的媒体工作流</text>
<text x="45" y="96" fill="#587187" font-size="17">已有网盘媒体时，可以从第 3 步的同步开始。</text>
<rect x="45" y="140" width="252" height="245" rx="18" fill="white" stroke="#dce5ed"/>
<rect x="65" y="161" width="36" height="36" rx="11" fill="#286bff"/>
<text x="83" y="186" text-anchor="middle" fill="white" font-size="20" font-weight="700">1</text>
<text x="65" y="232" font-size="23" font-weight="700" fill="#19394f">发现与订阅</text>
<text x="65" y="274" font-size="16" fill="#4a657b">搜索影视资料</text>
<text x="65" y="306" font-size="16" fill="#4a657b">选择来源和筛选规则</text>
<text x="65" y="338" font-size="16" fill="#4a657b">持续寻找目标资源</text>
<path d="M302,263 H324" stroke="#638094" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="332" y="140" width="252" height="245" rx="18" fill="white" stroke="#dce5ed"/>
<rect x="352" y="161" width="36" height="36" rx="11" fill="#4776b1"/>
<text x="370" y="186" text-anchor="middle" fill="white" font-size="20" font-weight="700">2</text>
<text x="352" y="232" font-size="23" font-weight="700" fill="#19394f">下载与转存</text>
<text x="352" y="274" font-size="16" fill="#4a657b">提交给下载器或网盘</text>
<text x="352" y="306" font-size="16" fill="#4a657b">接收到待整理目录</text>
<text x="352" y="338" font-size="16" fill="#4a657b">确认文件真正完成</text>
<path d="M589,263 H611" stroke="#638094" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="619" y="140" width="252" height="245" rx="18" fill="white" stroke="#dce5ed"/>
<rect x="639" y="161" width="36" height="36" rx="11" fill="#138b80"/>
<text x="657" y="186" text-anchor="middle" fill="white" font-size="20" font-weight="700">3</text>
<text x="639" y="232" font-size="23" font-weight="700" fill="#19394f">整理与同步</text>
<text x="639" y="274" font-size="16" fill="#4a657b">识别、分类、重命名</text>
<text x="639" y="306" font-size="16" fill="#4a657b">生成 STRM 与元数据</text>
<text x="639" y="338" font-size="16" fill="#4a657b">刷新媒体库</text>
<path d="M876,263 H898" stroke="#638094" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="906" y="140" width="252" height="245" rx="18" fill="white" stroke="#dce5ed"/>
<rect x="926" y="161" width="36" height="36" rx="11" fill="#8060b8"/>
<text x="944" y="186" text-anchor="middle" fill="white" font-size="20" font-weight="700">4</text>
<text x="926" y="232" font-size="23" font-weight="700" fill="#19394f">入库与播放</text>
<text x="926" y="274" font-size="16" fill="#4a657b">媒体服务器扫描</text>
<text x="926" y="306" font-size="16" fill="#4a657b">客户端发起播放</text>
<text x="926" y="338" font-size="16" fill="#4a657b">解析网盘地址或代理</text>
<text x="45" y="442" fill="#244a67" font-size="18">先用少量媒体跑通一次，再开启自动监控、订阅和定时同步。</text>
<text x="45" y="477" fill="#688093" font-size="14">CineCircuit · 使用指南 · 示意图</text>
</g></svg>